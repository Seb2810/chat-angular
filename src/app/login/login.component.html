

<div id="content" role="main" class="w-full  max-w-md mx-auto p-6">
    <div class="mt-7 bg-white  rounded-xl shadow-lg dark:bg-gray-800 dark:border-gray-700 border-2 border-red-300">
      <div class="p-4 sm:p-7">
        <div class="text-center">
          <h1 class="block text-2xl font-bold text-red-800 dark:text-white">Login</h1>
          <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
            Forgot your password ?
               <a  [routerLink]="['/forgetpswd']" class="text-red-400 decoration-2 hover:underline font-medium" >
              Click here
            </a>
          </p>

            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
           Not yet Member ?
            <a  [routerLink]="['/register']" class="text-red-400 decoration-2 hover:underline font-medium" >
              Click here
            </a>
          </p>
        </div>

        <div class="mt-5">
         <form (ngSubmit)="login()">
            <div class="grid gap-y-4">
              <div>
                <label for="email" class="block text-sm font-bold ml-1 mb-2 dark:text-white">Email address</label>
                <div class="relative">
                  <input type="email" [(ngModel)]="email" name="email" id="email"  class="py-3 px-4 block w-full border-2 border-gray-200 rounded-md text-sm focus:border-blue-500 focus:ring-blue-500 shadow-sm" required aria-describedby="email-error">
                </div>
                <p class="hidden text-xs text-red-600 mt-2" id="email-error">Please include a valid email address so we can get back to you</p>
              </div>
              <!--  second input -->
                  <div>
                <label for="password" class="block text-sm font-bold ml-1 mb-2 dark:text-white">Password</label>
                <div class="relative">
                  <input type="password" [(ngModel)]="password" name="password" id="password"  class="py-3 px-4 block w-full border-2 border-gray-200 rounded-md text-sm focus:border-blue-500 focus:ring-blue-500 shadow-sm" required aria-describedby="password-error">
                </div>
                <p class="hidden text-xs text-red-600 mt-2" id="password-error">Please include a valid password</p>
              </div>

              <button type="submit" class="cursor-pointer py-3 px-4 inline-flex justify-center items-center gap-2 rounded-md border border-transparent font-semibold bg-red-500 text-white hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all text-sm dark:focus:ring-offset-gray-800">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>


  </div>
