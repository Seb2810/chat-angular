<nav class="bg-red-700 relative w-full md:flex md:justify-between md:items-center px-5 py-4">

  <!-- Zone Logo / Marque et Bouton Burger -->
  <div class="flex items-center justify-between w-full md:w-auto">
    <a href="#" class="flex items-center space-x-2">
      <span class="text-2xl sm:text-3xl font-semibold font-['Pacifico'] italic whitespace-nowrap text-white">
        MENU
      </span>
    </a>

    <!-- Bouton Burger (visible uniquement sur mobile) -->
    <button (click)="toggleNavbar()" type="button" class="md:hidden text-white focus:outline-none" aria-label="Toggle menu">
      <svg viewBox="0 0 100 80" width="30" height="30" fill="currentColor">
        <rect width="100" height="15" rx="5"></rect>
        <rect y="30" width="100" height="15" rx="5"></rect>
        <rect y="60" width="100" height="15" rx="5"></rect>
      </svg>
    </button>
  </div>

  <!-- Liens de navigation : Affichés si menuShow est vrai OU si on est sur grand écran (md:flex) -->
  @if (menuShow) {
    <ul class="flex flex-col mt-4 space-y-4 md:flex-row md:items-center md:space-y-0 md:space-x-8 md:mt-0 md:mr-10">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </ul>
  } @else {
    <!-- Sur grand écran, on force l'affichage de la liste même si menuShow est faux -->
    <ul class="hidden md:flex flex-row items-center space-x-8 mr-10">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </ul>
  }

  <!-- Template réutilisable pour éviter de dupliquer les liens -->
  <ng-template #menuItems>
    <!-- Bouton de Connexion / Profil -->
    <li class="font-medium text-white text-xl hover:text-black transition-colors duration-200">
      @if (authState.user(); as user) {
        <div class="flex flex-col md:flex-row md:items-center gap-2">
          
       @if (profil(); as data) {

      @if (data.name) {
          <span class="text-sm md:text-base opacity-90">Bonjour {{ data.name }}</span>

        }@else{
           <span class="text-sm md:text-base opacity-90">Bonjour </span>
        }
      
      }@else{
           <span class="text-sm md:text-base opacity-90">Bonjour </span>
        }
          <button (click)="logout()" type="button" class="bg-white text-red-700 px-3 py-1 rounded text-sm font-semibold hover:bg-gray-100">
            Déconnexion
          </button>
        </div>
      } @else {
        <a routerLink="/login" class="block">Connexion</a>
      }
    </li>

    <!-- Lien Home -->
    <li class="font-medium text-white text-xl hover:text-black transition-colors duration-200">
      <a routerLink="/home" routerLinkActive="text-black font-bold" [routerLinkActiveOptions]="{exact: true}">Home</a>
    </li>

        @if (authState.user(); as user) {
    <!-- Lien Chat -->
    <li class="font-medium text-white text-xl hover:text-black transition-colors duration-200">
      <a routerLink="/chat" routerLinkActive="text-black font-bold">Chat</a>
    </li>

        <!-- Lien userboard -->
    <li class="font-medium text-white text-xl hover:text-black transition-colors duration-200">
      <a routerLink="/userboard" routerLinkActive="text-black h-12 w-12 font-bold">⚙️</a>
    </li>
      }
  </ng-template>

</nav>
