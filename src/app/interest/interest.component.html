

<div id="content" role="main" class="w-full  max-w-md mx-auto p-6">
    <div class="mt-7 bg-white  rounded-xl shadow-lg dark:bg-gray-800 dark:border-gray-700 border-2 border-red-300">
      <div class="p-4 sm:p-7">
        <div class="text-center">
          <h1 class="block text-2xl font-bold text-red-800 dark:text-white">Centres d'interets</h1>

        </div>

        <div class="mt-5">
         <form (ngSubmit)="submit()">
            <div class="grid gap-y-4">
              <div>
                 <div class="text-xs text-gray-700">Entrez les centres d'interets separé par un tiret avec ou sans espaces</div>
                <label for="interest" class="block text-sm font-bold ml-1 mb-2 dark:text-white">Centres d'interets</label>
                <div class="relative">

                  <input type="interest" [(ngModel)]="interest" name="interest" id="interest"  class="py-3 px-4 block w-full border-2 border-gray-200 rounded-md text-sm focus:border-blue-500 focus:ring-blue-500 shadow-sm" required aria-describedby="email-error">
                </div>
                <p class="hidden text-xs text-red-600 mt-2" id="interest-error">veuillez respecter le format de l'interet</p>
              </div>


              <button type="submit" class="cursor-pointer py-3 px-4 inline-flex justify-center items-center gap-2 rounded-md border border-transparent font-semibold bg-red-500 text-white hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all text-sm dark:focus:ring-offset-gray-800">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>


  </div>
