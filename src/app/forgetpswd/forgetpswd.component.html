
<div id="content" role="main" class="w-full  max-w-md mx-auto p-6">
    <div class="mt-7 bg-white  rounded-xl shadow-lg dark:bg-gray-800 dark:border-gray-700 border-2 border-red-300">
      <div class="p-4 sm:p-7">
        <div class="text-center">
          <h1 class="block text-2xl font-bold text-red-800 dark:text-white">Mot de Passe Perdu</h1>

        </div>

        <div class="mt-5">
         <form [formGroup]="registerForm" (ngSubmit)="renew()">
            <div class="grid gap-y-4">
       <div>

                <label for="email" class="block text-sm font-bold ml-1 mb-2 dark:text-white">Email address</label>
                <div class="relative">
                  <input type="email"
                   formControlName="email"
                    name="email"
                     id="email"
                     class="py-3 px-4 block w-full border-2 border-gray-200 rounded-md text-sm focus:border-blue-500 focus:ring-blue-500 shadow-sm"
                    [class.border-red-500]="getErrorMessage('email')"
                    [class.border-gray-200]="!getErrorMessage('email')"
                   />

                    </div>
                @if (getErrorMessage('email')) {
                  <p class="text-xs text-red-600 mt-2" id="email-error">
                    {{ getErrorMessage('email') }}
                  </p>
                }
              </div>
              <!--  second input -->
 <div>
            <label for="datepicker"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >
                Birthdate
              </label>

              <div class="relative">
            <div class="relative max-w-sm">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
              </div>

                <input
                  datepicker
                  id="default-datepicker"
                   class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 py-2.5 shadow-xs placeholder:text-body"
                  formControlName="birthdate"
                  name="birthdate"
                  (input)="onDateChange($event)"
                  type="text"
                  placeholder="Sélectionnez une date"
                  [class.border-red-500]="getErrorMessage('birthdate')"
                  [class.border-gray-200]="!getErrorMessage('birthdate')"

                />
              </div>
                @if (getErrorMessage('birthdate')) {
                  <p class="text-xs text-red-600 mt-2" id="birthdate-error">
                    {{ getErrorMessage('birthdate') }}
                  </p>
                }
              </div>
              </div>

              <button type="submit" class="cursor-pointer py-3 px-4 inline-flex justify-center items-center gap-2 rounded-md border border-transparent font-semibold bg-red-500 text-white hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all text-sm dark:focus:ring-offset-gray-800">Submit</button>
            </div>
          </form>
        </div>

<div class="mt-5 mx-auto text-center font-semibold text-gray-800 dark:text-gray">
  @if (renewedPassword()) {
    <p> Nouveau Mot de passe : {{ renewedPassword() }}</p>
  }
</div>

      </div>
    </div>


  </div>
